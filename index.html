<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Validação de Formulário</title>
</head>
<body>
    <h1>Validação de Formulário</h1>
    <form id="meuForm">
        <label for="campoA">Campo A:</label>
        <input type="number" id="campoA" name="campoA" required><br><br>

        <label for="campoB">Campo B:</label>
        <input type="number" id="campoB" name="campoB" required><br><br>

        <button type="submit">Enviar</button>
    </form>

    <p id="mensagem"></p>

    <script>
        const form = document.getElementById('meuForm');
        const mensagem = document.getElementById('mensagem');

        form.addEventListener('submit', function(event) {
            event.preventDefault();
            const campoA = Number(document.getElementById('campoA').value);
            const campoB = Number(document.getElementById('campoB').value);

            if (campoB > campoA) {
                mensagem.textContent = 'Formulário válido! Campo B é maior que Campo A.';
                mensagem.style.color = 'green';
            } else {
                mensagem.textContent = 'Formulário inválido! Campo B precisa ser maior que Campo A.';
                mensagem.style.color = 'red';
            }
        });
    </script>
</body>
</html>
